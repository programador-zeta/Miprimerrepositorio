services:
  - type: web
    name: somewhere-tag
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://esrhsaeruxqzlmkjaqmw.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
